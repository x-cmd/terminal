id: x-t-3-kitty

data:
  - name:
      en: overview
      cn: 概览
    qa:
      - id: what-is-kitty
        question:
          en: What is Kitty?
          cn: 什么是 Kitty？
        answer:
          en: A GPU-accelerated terminal emulator written in C with Python-based kitten framework. Created by Kovid Goyal (Calibre author). GPL-3.0 licensed. Linux, macOS, BSD.
          cn: 用 C 编写的、基于 Python kitten 框架的 GPU 加速终端模拟器。由 Kovid Goyal（Calibre 作者）创建。GPL-3.0 协议。支持 Linux、macOS、BSD。
        confidence: 9
        reference:
          - docs/3-kitty.en.md
          - docs/3-kitty.cn.md

      - id: what-makes-kitty-different
        question:
          en: What makes Kitty different from Alacritty?
          cn: Kitty 与 Alacritty 有何不同？
        answer:
          en: Alacritty bets on smallest + fastest. Kitty bets on most programmable: image protocols (Sixel, Kitty graphics, iTerm2), an extensible kitten plugin system, a built-in multiplexer.
          cn: Alacritty 押注最小 + 最快。Kitty 押注最可编程：图像协议（Sixel、Kitty graphics、iTerm2）、可扩展 kitten 插件系统、内置多路复用器。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

  - name:
      en: install
      cn: 安装
    qa:
      - id: how-to-install
        question:
          en: How do I install Kitty?
          cn: 如何安装 Kitty？
        answer:
          en: Run x env use kitty, or use a package manager (brew install --cask kitty on macOS, apt install kitty on Debian/Ubuntu, pacman -S kitty on Arch), or download from GitHub Releases.
          cn: 运行 x env use kitty，或用包管理器（macOS 上 brew install --cask kitty，Debian/Ubuntu 上 apt install kitty，Arch 上 pacman -S kitty），或从 GitHub Releases 下载。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

      - id: windows-support
        question:
          en: Does Kitty work on Windows?
          cn: Kitty 在 Windows 上能用吗？
        answer:
          en: No — Kitty is not officially supported on Windows. Use Alacritty, WezTerm, or Ghostty instead.
          cn: 不能 —— Kitty 在 Windows 上不官方支持。用 Alacritty、WezTerm 或 Ghostty。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

  - name:
      en: configuration
      cn: 配置
    qa:
      - id: config-format
        question:
          en: What config format does Kitty use?
          cn: Kitty 用什么配置格式？
        answer:
          en: Plain-text kitty.conf with comments (#) and sections ([name]). Located at ~/.config/kitty/kitty.conf on Linux and macOS.
          cn: 纯文本 kitty.conf，注释用 #，section 用 [name]。Linux 与 macOS 上位于 ~/.config/kitty/kitty.conf。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

      - id: live-config-reload
        question:
          en: Does Kitty reload config without restart?
          cn: Kitty 能在不重启的情况下重载配置吗？
        answer:
          en: Yes — edits to kitty.conf apply automatically on save. Force-reload with Ctrl+Shift+, (the default reload_config keybinding).
          cn: 可以 —— 编辑 kitty.conf 保存后自动生效。用 Ctrl+Shift+,（默认 reload_config 键绑定）强制重载。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

  - name:
      en: features
      cn: 功能
    qa:
      - id: image-protocols
        question:
          en: Which image protocols does Kitty support?
          cn: Kitty 支持哪些图像协议？
        answer:
          en: Three: Kitty graphics (Kitty-native), Sixel (DEC VT340 from the 1980s), and iTerm2. All three are first-class — display images, animations, and inline graphics.
          cn: 三种：Kitty graphics（Kitty 原生）、Sixel（1980 年代的 DEC VT340）、iTerm2。三种都是一流——显示图像、动画、内联图形。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

      - id: what-is-kitten
        question:
          en: What is a kitten?
          cn: 什么是 kitten？
        answer:
          en: A small companion program (Python or shell) that talks to kitty's internals over a Unix socket. Examples: kitten icat (display images), kitten diff (side-by-side diffs), kitten ssh (remote session via local kitty).
          cn: 通过 Unix 套接字与 kitty 内部通信的小伙伴程序（Python 或 shell）。示例：kitten icat（显示图像）、kitten diff（并排差异）、kitten ssh（通过本地 kitty 打开远程会话）。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

      - id: built-in-multiplexer
        question:
          en: Does Kitty have a built-in multiplexer?
          cn: Kitty 有内置多路复用器吗？
        answer:
          en: Yes — via kitty @ launch + Ctrl+Shift+Enter. For heavier multiplexing, pair with tmux.
          cn: 有 —— 通过 kitty @ launch + Ctrl+Shift+Enter。更重的复用可搭配 tmux。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

  - name:
      en: requirements
      cn: 要求
    qa:
      - id: opengl-version
        question:
          en: What OpenGL version does Kitty need?
          cn: Kitty 需要什么版本的 OpenGL？
        answer:
          en: OpenGL 3.3 or higher (since 0.40, Sep 2024). Older versions needed 3.0.
          cn: OpenGL 3.3 或更高（自 0.40 起，2024 年 9 月）。旧版本需要 3.0。
        confidence: 9
        reference:
          - docs/3-kitty.en.md

      - id: license
        question:
          en: What license is Kitty under?
          cn: Kitty 是什么协议？
        answer:
          en: GPL-3.0. Stricter than Apache-2.0 / MIT. Forks must be open-sourced.
          cn: GPL-3.0。比 Apache-2.0 / MIT 严格。Fork 必须开源。
        confidence: 9
        reference:
          - docs/3-kitty.en.md